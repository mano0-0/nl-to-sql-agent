[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nl-to-sql-agent"
version = "0.1.0"
description = "Ask a database questions in plain English, with the generated SQL checked before it runs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["llm", "sql", "text-to-sql", "agent", "guardrails", "claude"]
dependencies = [
    # Not yet on PyPI; installed from its repository until it is published.
    "llm-sql-guard @ git+https://github.com/mano0-0/llm-sql-guard.git",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
nl-sql = "nl_to_sql_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
